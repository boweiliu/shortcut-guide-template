[project]
name = "shortcut-guide"
version = "0.1.0"
description = "Interactive guide to the Studio desktop shortcut prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
]

[project.scripts]
shortcut-guide = "shortcut_guide.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shortcut_guide"]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]

[dependency-groups]
dev = [
    "imbue-common[testing]",
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.85",
]

[tool.pytest.ini_options]
testpaths = ["."]

[tool.uv.sources]
imbue-common = { git = "https://github.com/imbue-ai/mngr", rev = "e6ab2a4966f46511e9a45bb762c47a2aa36858c6", subdirectory = "libs/imbue_common" }
