[program:shortcut-guide]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/workspace_bare_scripts/venv_links.py ensure-project system/apps/shortcut_guide && uv sync --locked --project system/apps/shortcut_guide && python3 system/scripts/forward_port.py --manifest system/apps/shortcut_guide/app.toml --url http://localhost:8193 && exec system/apps/shortcut_guide/.venv/bin/shortcut-guide"
directory=/home/user/workspace
autostart=true
autorestart=true
startsecs=30
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/shortcut-guide-stdout.log
stderr_logfile=/var/log/supervisor/shortcut-guide-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
